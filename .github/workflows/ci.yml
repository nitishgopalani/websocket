name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Go test (media + brain)
        run: go test ./internal/media/ ./internal/brain/ -count=1 -timeout 120s

      - name: Go build
        run: go build -o /tmp/server ./cmd/server
